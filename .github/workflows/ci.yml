name: CI and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Check, test and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node -e 'const version = require("./package.json").version; if (process.env.GITHUB_REF_NAME !== "v" + version) throw new Error("Release tag must match package version v" + version);'
      - name: Install project dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Check, build and test
        run: npm run check
      - name: Pack release asset
        run: |
          mkdir -p "$RUNNER_TEMP/gui-debug-release"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/gui-debug-release"
          gui_debug_version="$(node -p 'require("./package.json").version')"
          cp "$RUNNER_TEMP/gui-debug-release/dsh-gui-debug-$gui_debug_version.tgz" "$RUNNER_TEMP/gui-debug-release/dsh-gui-debug.tgz"
      - name: Generate checksum
        working-directory: ${{ runner.temp }}/gui-debug-release
        run: sha256sum dsh-gui-debug.tgz > SHA256SUMS
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: gui-debug-${{ github.sha }}
          path: |
            ${{ runner.temp }}/gui-debug-release/dsh-gui-debug.tgz
            ${{ runner.temp }}/gui-debug-release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: gui-debug-${{ github.sha }}
          path: release
      - name: Verify package checksum
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Publish package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gui_debug_release_flags=(--draft --verify-tag --generate-notes --title "GUI Debug $GITHUB_REF_NAME")
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              gui_debug_release_flags+=(--prerelease)
            fi
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "${gui_debug_release_flags[@]}"
          fi
          gh release upload "$GITHUB_REF_NAME" release/dsh-gui-debug.tgz release/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
